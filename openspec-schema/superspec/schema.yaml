name: SuperSpec
version: 8
description: >
  Spec-driven workflow integrated with Superpowers skills.
  brainstorm → proposal → design → specs → tasks → plan → review → apply →
  verify-report → verify → finalize.
  design is optional in the DAG (produced from brainstorm + proposal but not
  required by tasks); when present it MUST satisfy the ADR / Non-Goals / Risks
  contract. review is a required DAG artifact produced from plan: for UI
  changes it records the L1/L2/L3 pre-apply review and freezes the approved
  contract hash; for non-UI changes it records `Result: SKIP`. apply requires
  review, so the design review can no longer be bypassed by prose alone.
  Apply is both a DAG artifact (generates apply.md, a minimal receipt)
  and a top-level apply: phase block (canonical /openspec-apply-change instruction
  body). Verify requires verify-report (which requires apply), so
  /openspec-verify-change cannot run before the verify-report artifact and
  /openspec-apply-change have executed. Finalize requires verify and is reached via
  /openspec-continue-change after verify reports PASS; its instruction executes
  the git-side closeout directly (merge worktree branch back into the
  feature branch, push the branch — which updates an existing spec
  pre-review PR if one was opened between plan and apply, or creates
  a remote tracking branch otherwise — and post a code-reviewer
  onboarding comment on the PR if one exists) and records the outcome
  in finalize.md.
  Apply uses git worktrees + subagent-driven-development (brings TDD and
  code-review transitively). executing-plans is documented only as a
  fallback for platforms without subagent support. v3 (historical):
  finalize was promoted from a manual post-verify step to a real DAG
  artifact, with its instruction invoking
  superpowers:finishing-a-development-branch. v4 (historical): finalize's
  instruction is rewritten to execute the git-side closeout directly;
  the skill is retained as a manual escape hatch for non-canonical flows
  (solo merge-to-main, brand-new PR via the skill, keep-as-is,
  discard — note that "no pre-review PR" is handled by the
  canonical closeout, not the escape hatch). Apply step 0
  wording is also updated to recommend a user-created feature branch
  as the canonical starting state (previously the schema recommended
  starting on the integration branch).
  v5 (historical): every Superpowers skill reference is now optional.
  brainstorm / plan / apply / finalize each carry an explicit inline
  FALLBACK (plan: write plan.md inline; apply: 2c inline executor;
  finalize: inline closeout modes) and must never halt because a
  skill is missing. This makes the schema self-contained for harnesses
  that install onePress without the upstream Superpowers plugin.
  The plan artifact also carries a self-contained rigor contract:
  Spec path, Global Constraints, Review Focus, File Structure,
  per-task Files and Interfaces, anti-placeholder rules, and a
  five-point Self-Review.
  v6 (historical): V2.2 pragmatic fusion. design carries an ADR /
  Non-Goals / Risks contract; specs carry Given/When/Then scenarios;
  tasks carry exact file paths and RED-GREEN-REFACTOR micro-steps;
  apply carries the TDD, root-cause debugging and fresh-evidence
  iron laws; a verify-report artifact (verification-evidence.md)
  sits between apply and verify, collects fresh terminal evidence and
  one cold-context code review, and the verify artifact requires it.
  Two deterministic scripts back the contract:
  onepress-plan-lint.sh (plan + design + tasks) and
  onepress-evidence-lint.sh (verification evidence).
  v7 (current): the pre-apply design review is promoted from a hidden
  apply-time prose check to a real DAG artifact. `review` requires
  `plan`, generates `review.md`, and `apply.requires` now includes
  `review`. `review.md` is written only when the review converges
  (`P0 = 0`, `P1 = 0`) and a human approves the UI contract, or when
  the change is non-UI (`Result: SKIP`). Failed rounds stay in
  `.review/round-<n>.md`, so the artifact's existence is a
  deterministic apply gate. `review.md` records SHA-256 hashes of
  ui-spec.md, sandbox-preview.html and plan.md; any later edit to
  those files invalidates the review. `onepress-review-lint.sh`
  verifies the receipt and hashes before apply. `design.requires`
  also gains `proposal` because the design artifact reads the
  `**UI Change**` decision from proposal.md.
  v8 (current): the verification loop becomes stateful. A companion
  `review-ledger.md` (append-only; `F-<n>` ids with
  `<file>::<defect-class>` fingerprints) becomes the single source of
  cross-round review state: apply.md keeps only the current iteration plus
  a pointer, and verification-evidence.md is regenerated per round. Cold
  review reads five inputs (range, design, tasks, specs, ledger) and
  reviews an increment plus a regression surface, except in the round that
  declares PASS, which MUST use the full BASE..HEAD range. Rounds are
  capped at 3 with ESCALATE beyond that, and a repeated fingerprint forces
  a module rewrite plus a boundary matrix (FORCE-REWRITE). `Debatable`
  findings have no reproducible input, are recorded, and never block. New
  tooling: `onepress-verify.sh` orchestrates evidence from plan.md's
  Evidence Map with scope tiers, summary-only output, `--range` and
  `--churn`. Gate SKIP splits into `not-applicable` and `no-coverage`, the
  latter failing required gates; gate 4 detects pytest, vitest or npm test.
  The review command is renamed `openspec-review-change`, and 14 flat
  `/op-<key>` entry files forward to the canonical names.

artifacts:
  - id: brainstorm
    generates: brainstorm.md
    description: Collaborative design exploration using Superpowers brainstorming
    template: brainstorm.md
    instruction: |
      PRECHECK — skill availability:
      If `superpowers:brainstorming` is in your available skills list,
      use the Skill tool to invoke it (canonical path).
      If it is NOT available, do NOT stop and do NOT ask the user to
      install a plugin — run SKILL FALLBACK below and state which path
      you took.

      SKILL FALLBACK — inline brainstorming:
      1. Explore the project context (existing code, specs, constraints).
      2. Ask clarifying questions, one at a time.
      3. Propose 2-3 approaches with explicit trade-offs.
      4. Present the design in sections for approval.
      5. Record the validated design.

      IMPORTANT output redirection:
      - Do NOT write to `docs/superpowers/specs/`. Instead, write the
        brainstorming design output directly to this change's `brainstorm.md`.
      - If brainstorming produces a design document, also write it to
        this change's `design.md` (this will pre-fill the design artifact).

      After brainstorming completes, summarize the agreed design in
      brainstorm.md using the template structure.

      Both paths must cover:
      1. Explore project context
      2. Ask clarifying questions (one at a time)
      3. Propose 2-3 approaches with trade-offs
      4. Present design sections for approval
      5. Output the validated design
    requires: []

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document based on the brainstorming output.

      Read brainstorm.md for the validated design. Extract:
      - **Why**: The motivation (from brainstorming discussion)
      - **What Changes**: Specific changes agreed upon
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Check `openspec/specs/` for existing spec names.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Since brainstorming already explored the problem space,
      this should be a concise extraction, not a new exploration.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Each capability listed here will need a spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how".
    requires:
      - brainstorm

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document explaining HOW to implement the change.

      Check if brainstorming already produced a design.md file.
      If design.md already exists with content from brainstorming,
      review and refine it rather than starting from scratch.

      If design.md is empty or doesn't exist, create it from
      the brainstorm.md output.

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Good design docs explain the "why" behind technical decisions.

      V2.2 DEFENSIVE DESIGN CONTRACT (mandatory):
      - Include at least one ADR with Context, Decision, Alternatives
        considered, Rationale, and Consequences.
      - Include 3-5 explicit Non-Goals (YAGNI). Fewer than 3 or more
        than 5 is a contract violation.
      - Include Risks / Trade-offs with a mitigation for each row.
      - Record rejected alternatives; the implementer must not
        re-litigate settled decisions without new evidence.

      UI CHANGE GATE (onePress):
      Before writing design.md, read `**UI Change**: yes|no` from
      proposal.md.
      - If `no`: do NOT create ui-spec.md or sandbox-preview.html.
      - If `yes`: also produce `openspec/changes/<name>/ui-spec.md`
        from `templates/ui-spec.md` and fill all seven sections:
        1) component hierarchy, 2) design tokens (16 semantic color
        channels + font pairing + xs..3xl density), 3) four-state
        matrix, 4) responsive breakpoints and anti-breakage rules,
        5) touch targets and micro-motion, 6) industry anti-patterns,
        7) sandbox preview (control bar + Pin-to-AI). The file MUST
        start with `> Review-Status: PENDING` as its third line.
        Then produce `openspec/changes/<name>/sandbox-preview.html`
        (single file, inline CSS/JS, four-state buttons, Light/Dark
        toggle, the same 16 CSS variables, a Google Fonts link, and a
        prefers-reduced-motion fallback).
      Do not inline a UI contract into design.md; ui-spec.md is the
      single source of truth for UI decisions.
    requires:
      - brainstorm
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      Specs should be testable - each scenario is a potential test case.

      V2.2 SCENARIO CONTRACT:
      - Every Requirement MUST have at least one GIVEN/WHEN/THEN
        scenario with an observable, testable outcome.
      - Cover at least one error path or boundary input per capability.
      - Do not write scenarios that only restate the implementation; a
        scenario is a test case, not a code echo.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Task right-sizing: each task is a 2-5 minute cognitive unit.
      - Every task MUST name the exact file paths it touches inside
        backticks, plus the command that verifies it.
      - Every task that changes logic MUST nest three checkboxes:
        RED (failing test name + expectation), GREEN (minimal code),
        REFACTOR (cleanup with tests still green).
      - Docs/config-only tasks MUST write `TDD: N/A (<reason>)`.
      - Order tasks by dependency (what must be done first?)

      Reference specs for what needs to be built. If design.md exists,
      reference it for how to build it — but design is optional (see
      openspec-conventions: design.md is only for changes that need to
      explain non-trivial technical decisions).
    requires:
      - specs

  - id: plan
    generates: plan.md
    description: Micro-task implementation plan using Superpowers writing-plans (canonical) or inline fallback
    template: plan.md
    instruction: |
      PRECHECK — skill availability:
      If `superpowers:writing-plans` is in your available skills list,
      use the Skill tool to invoke it through the CANONICAL ADAPTER below.
      If it is NOT available, do NOT stop, do NOT report "skill
      unavailable", and do NOT ask the user to install a plugin — run
      SKILL FALLBACK below. State only "using inline fallback" as a
      status note, not as an error or a missing dependency.

      CANONICAL ADAPTER — use the upstream skill without breaking the DAG:
      1. Invoke `superpowers:writing-plans`.
      2. Override its save path: write the plan to this change's
         `plan.md`, never to `docs/superpowers/plans/`. Treat this
         instruction as the user preference that overrides the skill's
         default location.
      3. Use `templates/plan.md` as the section contract. If the skill
         produces its own header, merge it into this template: keep
         Goal, Architecture, Tech Stack, Spec, Global Constraints,
         Review Focus, File Structure, per-task Files/Interfaces, and
         Self-Review.
      4. Ignore the skill's Execution Handoff. Do NOT pause to ask the
         user to choose subagent-driven vs native. OpenSpec's apply
         artifact owns execution. Record `Execution: OpenSpec apply
         phase` in plan.md.
      5. Run the onePress self-review and the plan lint from the
         FALLBACK below; fix all failures before finishing. The lint
         also validates sibling `design.md` (ADR / Non-Goals / Risks)
         and `tasks.md` (exact file paths + RED-GREEN-REFACTOR).

      SKILL FALLBACK — write plan.md inline:
      1. Inputs: this change's `tasks.md`, `design.md` (optional),
         `proposal.md`, and `specs/**/*.md`. The plan must argue from
         these artifacts, not from memory.
      2. Scope check: if the spec covers multiple independent
         subsystems, split the plan per subsystem (or record why one
         plan is still coherent). Each plan must produce working,
         testable software on its own.
      3. File structure: before defining tasks, map every file to be
         created, modified, or tested and state its single
         responsibility. Follow existing project patterns; do not
         restructure unrelated files.
      4. Task right-sizing: a task is the smallest unit with its own
         test cycle and a reviewer-worthy gate. Fold setup, config,
         scaffolding, and docs into the task whose deliverable needs
         them. Each task ends with an independently testable
         deliverable.
      5. Step granularity: every step is one action with a checkable
         result. Use TDD order: write the failing test (test name +
         assertions, exact values), run it and record the expected
         failure, implement the minimal code (exact signature and
         file), run it and record the expected pass, then commit.
         Name exact file paths, exact commands, and expected output.
      6. Plan header: fill Goal, Architecture, Tech Stack, and Spec
         (paths to this change's spec/design artifacts).
      7. Global Constraints: copy the spec's project-wide rules
         verbatim — version floors, dependency limits, naming/copy
         rules, platform requirements. One line each.
      8. Review Focus: list the five input classes or failure modes
         the spec implies but no task's tests exercise, most likely
         first. For each line, add the test that pins it to the owning
         task. Write "None found" only after checking.
      9. Interfaces: for every task, write Consumes / Produces with
         exact function names, parameters, and return types. A task
         implementer sees only that task; this block is how they learn
         neighboring contracts.
      10. Anti-placeholder rule: no `TBD`, `TODO`, "handle edge cases",
          "add appropriate validation", "write tests for the above",
          or types/functions no task defines. A plan is the set of
          decisions the implementer cannot make alone; a plan longer
          than the code it describes has written the code instead.
      11. Self-review before finishing (fix inline, do not re-review):
          a. Spec coverage: every requirement maps to a task.
          b. Step scan: every step lets the implementer write exactly
             one reasonable thing; no transcript and no placeholder.
          c. Type consistency: names/signatures in later tasks match
             earlier definitions.
          d. Review Focus: every listed failure mode has a test in its
             owning task.
          e. Proportion: the plan is not several times longer than the
             spec; code blocks are not the majority of the document.
      12. Write the result directly to this change's `plan.md` using
          `templates/plan.md`; never write to `docs/superpowers/plans/`.
      13. If a task cannot be decomposed below 5 minutes, split it in
          `tasks.md` first and note the split in `plan.md`.
      14. Finish with `**Totals:** <N tasks, M commits>` and
          `Execution: OpenSpec apply phase`. Do not pause for a
          subagent-driven/native choice.
      15. If `scripts/onepress-plan-lint.sh` exists, run
          `bash scripts/onepress-plan-lint.sh --change <change-dir>`
          and fix every FAIL before finishing. The lint checks
          `plan.md`, sibling `design.md` (ADR / Non-Goals / Risks) and
          sibling `tasks.md` (exact file paths + RGB micro-steps). For a
          change created before the V2.2 contract, add `--only-plan` to
          skip the sibling checks instead of rewriting its artifacts.

      IMPORTANT output redirection:
      - Do NOT write to `docs/superpowers/plans/`. Instead, write
        the plan directly to this change's `plan.md`.

      The plan MUST reference the specs and design artifacts in this
      change directory.
    requires:
      - tasks

  - id: review
    generates: review.md
    description: Pre-apply design review gate (UI changes) or SKIP receipt (non-UI changes)
    template: review.md
    instruction: |
      PRE-APPLY DESIGN REVIEW GATE (onePress).

      This artifact is the only bridge between plan and apply. Apply MUST
      NOT start until review.md exists with `Result: PASS` (UI change) or
      `Result: SKIP` (non-UI change). Do NOT write business code here.

      0. Read `**UI Change**: yes|no` from proposal.md.
         - If `no`: write review.md with `Result: SKIP (UI Change: no)`,
           `P0: 0`, `P1: 0`, `Review-Status: N/A`, and stop. This artifact
           is complete; do not create ui-spec.md or sandbox-preview.html.
         - If `yes`: continue with steps 1-6.

      1. Inputs (read-only): proposal.md, design.md (if present),
         specs/**/*.md, tasks.md, plan.md, ui-spec.md,
         sandbox-preview.html, docs/design-system/projectbaseline/MASTER.md,
         and templates/review-rubric.md. Review from these files, not from
         conversation memory. If the harness provides `/openspec-review-change`, it is
         a shortcut for the same procedure; otherwise execute it inline.

      2. L1 deterministic preflight: when Playwright and
         @axe-core/playwright are available, run the sandbox preflight
         from review-rubric.md section 6. Record PASS/FAIL/SKIP. Missing
         dependencies are SKIP; do not install packages.

      3. L2 cold-context review: dispatch a zero-history subagent when
         the harness supports one; otherwise use a fresh session with only
         the inputs above. Evaluate review-rubric.md sections 1-4. Every
         finding MUST cite a ui-spec section or a DOM selector; findings
         without evidence are recorded as `no-evidence`, are not scored,
         and MUST NOT block. The blocking criterion is `P0 = 0` and
         `P1 = 0`.

      4. Fix and re-run: revise only ui-spec.md and
         sandbox-preview.html, then re-run L1/L2. Write each round to
         `.review/round-<n>.md` (create `.review/` if needed). Maximum 3
         rounds. If the review does not converge, record `ESCALATE` in the
         round file and stop; do NOT create review.md.

      5. L3 human approval: only a human may set ui-spec.md line 3 to
         `> Review-Status: APPROVED`. The agent MUST NOT self-approve.

      6. On convergence, compute SHA-256 for ui-spec.md,
         sandbox-preview.html and plan.md (use `sha256sum`, or
         `shasum -a 256` when sha256sum is unavailable). Write review.md
         from templates/review.md with:
         - `Result: PASS`
         - `P0: 0`, `P1: 0`
         - `L1`, `L2`, `L3: APPROVED (<approver>, <date>)`
         - `ui-spec-sha256`, `sandbox-sha256`, `plan-sha256`
         - the Findings table and final conclusion.
         review.md is the DAG receipt: its existence means apply is
         unblocked. Any later change to ui-spec.md, sandbox-preview.html
         or plan.md invalidates it: delete review.md, reset
         `Review-Status` to PENDING, and re-run this artifact
         (incremental review of the changed sections is enough).

      Validation: `bash scripts/onepress-review-lint.sh --change <change-dir>`
      MUST exit 0 before apply. The lint checks Result, P0/P1, L3 approval,
      and the three hashes against the current files.
    requires:
      - plan

  - id: apply
    generates: apply.md
    description: Implementation receipt confirming the apply phase completed
    template: apply.md
    instruction: |
      This artifact is generated by `/openspec-apply-change`, not `/openspec-continue-change`.
      If you reached this via `/openspec-continue-change`, exit and run `/openspec-apply-change`
      instead. The canonical implementation instructions live in the
      top-level `apply:` phase block below.

      apply.md is a minimal receipt — its template lives at
      `templates/apply.md`; its production is documented in the apply:
      phase block. Verification outcome is recorded in verify.md
      (Overall Decision section), not here.
    requires:
      - review

  - id: verify-report
    generates: verification-evidence.md
    description: Fresh terminal evidence plus one cold-context code review, collected before verify
    template: verification.md
    instruction: |
      V2.2 EVIDENCE AND COLD-REVIEW GATE — run this before verify.

      This artifact exists to make completion claims falsifiable. Do
      NOT reuse any output from the apply session or from an earlier
      iteration. Every command below MUST be executed again now.

      1. Establish the review range with the orchestrator, not by hand.
         Read `apply.md` for the applied iteration, then run
         `bash scripts/onepress-verify.sh --change <change-dir> --range`
         and copy its two output lines verbatim into the report: the
         `incremental <last_reviewed_sha>..HEAD` span and the
         `regression surface (<n> files)` list. On the round that
         declares PASS, run
         `bash scripts/onepress-verify.sh --change <change-dir> --final --base <BASE_SHA>`
         (BASE_SHA = the commit before this change's first implementation
         commit, or the merge-base with the integration branch) and
         record the `full <BASE_SHA>..HEAD` span instead. The script
         reads `last_reviewed_sha` and `review_round` from
         `review-ledger.md`; do not hand-compute or widen the range. If
         the work is uncommitted, record BASE_SHA as the branch point
         and say so explicitly.

      2. Identify the commands that can prove each claim (The Gate
         Function):
         - the project's test command (unit/integration);
         - build and lint/typecheck commands, when the project has them;
         - `bash scripts/onepress-gate.sh --change <change-dir>` when
           `ui-spec.md` exists (UI changes);
         - `bash scripts/onepress-evidence-lint.sh --change <change-dir>`
           at the end of this artifact.
         A claim with no command is not verifiable; record it as
         `unverified` instead of asserting it.

      3. RUN each command in the terminal, capture the full exit code
         and pass/fail counts, and paste a raw output excerpt into
         `verification-evidence.md`. Prefer
         `bash scripts/onepress-verify.sh --change <change-dir>`: it
         executes every Evidence Map row, rewrites sections 1-3 with the
         pass/fail counts and `log:` pointers, and exits non-zero on any
         failing row. Required sections:
         `## 1. Commands`, `## 2. Fresh Command Results`,
         `## 3. Evidence Table`, `## 4. Cold-Context Review`,
         `## Overall Decision`. At least two fenced `text` blocks MUST
         contain `exit code:`. The Evidence Table MUST contain at least
         one row whose exit code is 0 for every required command.

      4. READ the output. A non-zero exit code is a FAIL. Build or
         test warnings remain unresolved unless this report states an
         explicit exclusion rule. Never write speculative phrases such
         as "should pass" or "looks correct"; the lint rejects them.

      5. Cold-context code review (once per round, read-only):
         - Assemble exactly five inputs: the diff for the recorded
           `Reviewed Range` and its `Regression Surface` line,
           `design.md`, `tasks.md`, `specs/**/*.md`
           and `review-ledger.md`. Do not include the apply session
           history and do not widen the range on your own.
         - If the harness supports subagents (for example a CodeReview
           subagent), dispatch exactly one read-only reviewer with those
           inputs directly. Record `Mode: subagent` and
           `Packet: current-session diff`. Do NOT require or create
           `code-review-packet.md` in this mode.
         - If the harness does not support subagents, build
           `code-review-packet.md` in the change directory with the
           same inputs, record `Mode: human-fresh-session` and
           `Packet: code-review-packet.md`, keep the packet on disk, and
           tell the user to open a fresh session with
           `templates/code-reviewer.md`.
         - Triage every finding as Critical (crash / core function /
           security), Important (logic gap / test does not verify
           behavior / misleading name) or Minor (style / micro-perf).
           Every finding MUST cite `file:line` or a diff hunk.
         - Record counts in the report as `- Critical: <n>`,
           `- Important: <n>`, `- Debatable: <n>` and `- Minor: <n>`.
           If Critical or Important is greater than zero, record
           `Overall Decision: FAIL`, return to apply, fix, and re-run
           this artifact. Debatable and Minor are recorded but never
           block; every Debatable MUST carry a reproducer request.
         - Round budget: at most 3 cold-review rounds. Only the round
           that declares `Overall Decision: PASS` may use
           `Reviewed Range: full` and record the matching
           `Regression Surface` line; earlier rounds review the increment
           plus regression surface. Without convergence by round 3,
           record `ESCALATE` and stop; do not start round 4.
         - Ledger write-back (mandatory): before ending this artifact,
           append one row per finding to `review-ledger.md` (`ID`,
           `Fingerprint`, `Level`, `File`, `Round`, `Status`), then set
           `last_reviewed_sha` to HEAD_SHA and increment
           `review_round` by one. Without this write-back the increment,
           the churn guard and the 3-round budget all stop working.
         - Receiving review: do not perform agreement. Verify each
           finding against the code; accept it with evidence or rebut
           it with evidence in the report.

      6. Validate the report:
         `bash scripts/onepress-evidence-lint.sh --change <change-dir>`
         must exit 0. Fix every FAIL before declaring this artifact
         complete. Then run verify.
    requires:
      - apply

  - id: verify
    generates: verify.md
    description: Post-implementation verification against specs, design, and tasks
    template: verify.md
    instruction: |
      ONE PRESS GATES (all harnesses):
      COMBINED ENTRY (V3.3): when this step is invoked through
      `/op-finish` (or `/openspec-finish-change <change>`), run it as a
      chain: verify-report → verify → finalize, with a single user
      confirmation up front. Short-circuit and return to apply when the
      evidence has `Critical > 0` or `Important > 0`, or when verify is
      FAIL. PASS and PASS WITH WARNINGS continue to finalize. Each step
      still writes its own artifact; the chain changes the interaction,
      not the evidence rules. Standalone invocation of any step remains
      valid and unchanged.
      EVIDENCE FIRST (V2.2): verify MUST NOT run before
      verification-evidence.md exists and
      `bash scripts/onepress-evidence-lint.sh --change <change-dir>`
      exits 0. Re-run the commands yourself only if the evidence is older
      than the latest code change; otherwise cite the fresh report. A
      report with `Critical > 0` or `Important > 0` is a FAIL.

      When the change has ui-spec.md, run gates 0-8 and record
      PASS/FAIL/SKIP plus AUTO/MANUAL for each one. Gate 0.5
      (`Review-Status: APPROVED`) is enforced by /openspec-review-change and
      scripts/onepress-gate.sh before apply; verify MUST re-check it:
      0 contract presence: ui-spec.md and sandbox-preview.html exist
      0.5 review lock: ui-spec.md Review-Status must be APPROVED (AUTO)
      1 four-state matrix matches, Loading reserves space, CLS < 0.1 (MANUAL)
      2 token purity (inline style / hardcoded colour / arbitrary px) and
        WCAG contrast >= 4.5:1, >= 3:1 for large text and control borders (AUTO)
      3 breakpoints: no horizontal scroll, long tokens wrap, chip/badge
        can wrap or expose a +n disclosure (MANUAL)
      4 state-machine unit tests only; RTL queries or DOM snapshots are a FAIL (AUTO)
      5 a11y: focus-visible ring kept, icon buttons have aria-label, form
        errors use aria-describedby, decorative icons use aria-hidden (AUTO)
      6 interaction: hit area >= 44x44px, cursor-pointer, transitions
        150-250ms, prefers-reduced-motion honoured (AUTO)
      7 anti-patterns: no emoji icons, no entry from ui-spec section 6 (AUTO)
      8 sandbox parity: implementation does not drift from sandbox-preview.html (MANUAL)
      Prefer `bash scripts/onepress-gate.sh --change <change-dir>`: it
      automates gates 0/0.5/2/4/5/6/7 and prints MANUAL for 1/3/8.
      Use `--require-review` in CI; `--no-require-review` only for
      legacy changes created before 1.1.0.
      Any unconfirmed MANUAL gate means the verdict MUST NOT be PASS.
      A CRITICAL FAIL blocks archiving.

      Use the Skill tool to invoke **openspec-verify-change** (the
      `/openspec-verify-change` slash command is its user-facing equivalent).

      apply.md MUST exist before this artifact runs — the DAG enforces
      this. If apply.md is missing, run `/openspec-apply-change` first. After every
      apply iteration (whether the first or a re-run), verify should be
      invoked so the convergence loop can decide whether more apply
      iterations are needed.

      verification-evidence.md MUST also exist: the DAG now requires the
      verify-report artifact. If it is missing, run its instructions
      (`openspec instructions verify-report --change <name>`) before
      verifying.

      verify.md is overwritten each run. Copy the `Iteration:` value
      from apply.md so verify and apply stay in lockstep.

      The verify step MUST perform the following checks and record
      results in verify.md using the template:

      1. **Structural validation**: Run `openspec validate --all --json`
         in the repository root and confirm every item returns
         `"valid": true`. If any item fails, record the issues and
         return to fix the underlying artifact before proceeding.

      2. **Task completion**: Confirm every checkbox in tasks.md is
         `- [x]`. For any `- [ ]` remaining, document the reason
         (e.g. manual / out-of-scope / blocked) and whether it blocks
         archive.

      3. **Delta spec sync state**: For each directory under
         `openspec/changes/<name>/specs/`, compare against the
         corresponding `openspec/specs/<capability>/spec.md` and
         record one of:
         - ✓ Already synced
         - ✗ Needs sync (list the capabilities)
         - N/A (no delta specs produced)

      4. **Design/specs coherence**: Spot-check that design.md
         decisions reference or align with the requirements listed
         in specs/. Record any drift as a warning (non-blocking).

      5. **Implementation signal**: Confirm all code changes are
         committed (no unstaged files in the worktree). Cite the
         commit range if known.

      Recommended convergence loop:
      - PASS → /openspec-continue-change advances to the finalize artifact, which
        executes the git-side closeout directly (merge worktree →
        feature branch, push the branch, update the PR if one exists,
        post code-reviewer comment if a PR is present). The skill
        superpowers:finishing-a-development-branch is retained as a
        manual escape hatch for non-canonical flows. /openspec-archive-change
        runs once finalize.md exists.
      - PASS_WITH_WARNINGS → same path as PASS; warnings are recorded
        but do not block.
      - FAIL with code-fixable items → return to apply, re-run, re-verify.
      - FAIL with artifact-level items (e.g. spec drift) → fix the
        offending artifact, then re-enter apply.
      - Iteration > 5 → stop looping; report to the user.

      See docs/workflow-details.md for the full convergence pattern.

      If `openspec-verify-change` skill is unavailable, fall back to
      running the 5 checks manually and recording results in verify.md.
    requires:
      - verify-report

  - id: finalize
    generates: finalize.md
    description: Git-side closeout — merge worktree back into feature branch, push, optionally open PR, post code-reviewer comment
    template: finalize.md
    instruction: |
      The git-side closeout is Superspec's canonical finalize flow:
      merge the implementation worktree branch back into your feature
      branch locally, push the feature branch (which updates the
      existing PR if one was opened manually between plan and apply
      for spec pre-review, or creates a remote tracking branch if
      not), write the finalize.md receipt, and — if a PR exists —
      post a code-reviewer onboarding comment on it. The spec
      pre-review PR is an optional team-workflow pattern; the
      canonical closeout works either way.

      Prerequisites for the git-side closeout (canonical path):
      - You are on a feature branch in the main checkout (apply
        step 0 should have recommended this — check `git branch
        --show-current`).
      - The feature branch is NOT the integration branch (main /
        master); if it is, skip the git-side closeout and use the
        escape hatch at the bottom of this instruction.
      - Apply ran in a worktree at `.worktrees/<change-name>/` with
        a worktree branch named `<change-name>`.

      Optional precondition (recommended for team workflows):
      - A PR for this feature branch already exists on the remote.
        This is the "spec pre-review PR" — opened manually between
        plan and apply so the logic reviewer can approve the
        proposal/specs/plan before code is written. If you didn't
        open a pre-review PR, the canonical git-side closeout
        still works: it merges the worktree back, pushes the
        feature branch (creating the remote tracking branch if
        needed), and the code-reviewer comment subroutine
        self-skips (recording `PR comment: skipped (no PR)` in
        finalize.md). You can `gh pr create` after finalize
        completes, or never open a PR at all.

      If a structural prerequisite (feature branch, worktree) is
      not met, skip the auto-executed flow below:
      - If `superpowers:finishing-a-development-branch` is in your skill
        list, invoke it (escape hatch — see the bottom).
      - If it is NOT available, do NOT stop. Pick one SKILL FALLBACK
        inline closeout mode and record the choice plus the commands
        you ran in finalize.md:
        a) keep-as-is — leave branch and worktree untouched (default
           when unsure; ask the user first);
        b) merge-locally — `git checkout <feature-branch>` then
           `git merge --no-ff <change-name>`;
        c) cleanup — do (b), then
           `git worktree remove .worktrees/<change-name>` and
           `git branch -d <change-name>`;
        d) discard — `git worktree remove --force .worktrees/<change-name>`
           then `git branch -D <change-name>` (confirm with the user
           before discarding).

      Git-side closeout execution steps:

      1. Compute paths and discover branch names:

         WORKTREE=$(git worktree list --porcelain | awk '/^worktree / {wt=$2} /^branch refs\/heads\/<change-name>/ {print wt; exit}')
         # If WORKTREE is empty, list `git worktree list` and ask the
         # user which path corresponds to this change.
         WORKTREE_BRANCH="<change-name>"
         FEATURE_BRANCH=$(git -C "$WORKTREE" log --format=%D -1 HEAD~$(git -C "$WORKTREE" rev-list --count HEAD ^"<integration-branch>") | tr ',' '\n' | grep -oE '^ *[^ ]+' | head -1)
         # Fallback: ask the user to confirm FEATURE_BRANCH if
         # detection is ambiguous.

      2. Verify tests pass in the worktree:

         cd "$WORKTREE"
         <project test command, e.g. `npm test`, `cargo test`, `pytest`>
         # Stop on failure — record the failure in finalize.md and
         # do not proceed.

      3. Switch to feature branch in main checkout and pull:

         MAIN_ROOT=$(git -C "$WORKTREE" rev-parse --git-common-dir)/..
         cd "$MAIN_ROOT"
         git checkout "$FEATURE_BRANCH"
         git pull

      4. Merge worktree branch (fast-forward only):

         git merge --ff-only "$WORKTREE_BRANCH"
         # If fast-forward fails, stop. The feature branch diverged
         # after worktree creation; the user must reconcile manually
         # (rebase the worktree branch onto the feature branch, then
         # re-enter finalize).

      5. Re-verify tests on the merged result:

         <project test command>
         # Stop on failure — the worktree branch is still on disk for
         # forensics until the user re-runs finalize.

      6. Worktree cleanup with provenance guard
         (borrowed from superpowers:finishing-a-development-branch
         Step 6 — see "Borrowed logic" below for attribution and the
         recreation method):

         WORKTREE_REL=$(realpath --relative-to="$MAIN_ROOT" "$WORKTREE")
         case "$WORKTREE_REL" in
           .worktrees/*|worktrees/*) OWN=1 ;;
           *) case "$WORKTREE" in
                "$HOME/.config/superpowers/worktrees/"*) OWN=1 ;;
                *) OWN=0 ;;
              esac ;;
         esac
         if [ "$OWN" = "1" ]; then
           git worktree remove "$WORKTREE"
           git worktree prune
         else
           # Harness owns this worktree; leave it in place.
           # Record this in finalize.md as Cleanup: preserved (harness-owned).
           true
         fi

      7. Delete the local worktree branch:

         git branch -d "$WORKTREE_BRANCH"

      7.5 ARCHIVE BLOCKING REGRESSION (onePress): the archive step
          (openspec-archive-change / `/op-archive`) MUST run the full
          self-test suite AFTER it syncs the delta specs and BEFORE it
          moves this change directory:

            bash dev/scripts/verify-manifest.sh
            bash dev/scripts/verify-carriers.sh
            bash dev/scripts/verify-telemetry.sh
            bash dev/scripts/verify-gate.sh
            bash dev/scripts/verify-plan-lint.sh
            bash dev/scripts/verify-evidence-lint.sh
            bash dev/scripts/verify-review-lint.sh
            bash dev/scripts/verify-verify.sh
            bash dev/release-check.sh

          Any failing suite MUST abort the archive: the change directory
          stays in `openspec/changes/`, the failing suite names are printed,
          and no half-written archive is left behind. Record the outcome in
          finalize.md as `Archive blocking regression: PASS|FAIL (<suite>)`.
          When the installer was not applied to this repo, suites whose
          scripts are absent are recorded as `SKIP (not installed)` — never
          as PASS.

      8. Write finalize.md per templates/finalize.md to
         openspec/changes/<change-name>/finalize.md. Required values
         for the git-side closeout:
         - Outcome: `pr-updated`
         - Branch: <feature-branch>
         - Base branch: <integration branch, typically `main`>
         - Final state: `pr-updated`
         - PR URL: discovered via `gh pr view <feature-branch> --json url --jq .url`
         - Worktree: <path or "removed">
         - Cleanup: `removed` (or `preserved (harness-owned)`)
         - Tests baseline status at finish: `passing`
         - PR comment status: filled in by step 12 below (or by
           step 11 if the user declines the PR-creation prompt /
           the session is non-interactive)
         - Next step: per templates/finalize.md `pr-updated` bullet
           (archive → push → merge sequence).

      9. Commit the receipt on the feature branch:

         git add openspec/changes/<change-name>/finalize.md
         git commit -m "docs(openspec): finalize receipt for <change-name>"

      10. Push the feature branch:

          git push origin "$FEATURE_BRANCH"
          # If a PR already exists for this branch, it auto-updates
          # with the merge commits, finalize.md, and the implementation
          # history. If no PR exists, this push creates (or updates)
          # the remote tracking branch — step 11 below will offer to
          # open a PR.

      11. Offer to open a code-review PR (interactive prompt). This
          step makes finalize the SDLC-natural moment to open the PR
          when the team didn't open one for spec pre-review:

          PR_NUMBER=$(gh pr view "$FEATURE_BRANCH" --json number --jq .number 2>/dev/null)

          If PR_NUMBER is non-empty:
            A PR already exists (likely the spec pre-review PR).
            Skip to step 12 — nothing to prompt.

          If PR_NUMBER is empty AND the session is interactive:
            a. Read proposal.md (if present at
               openspec/changes/<change-name>/proposal.md) and infer
               a conventional-commit type for the suggested title:
                 - feat:     new capability or behavior change (default if unclear)
                 - fix:      bug fix restoring expected behavior
                 - refactor: internal restructuring without behavior change
                 - docs:     documentation-only
                 - test:     tests-only
                 - chore:    tooling, deps, config
               If a natural scope is obvious (e.g., an affected
               capability name from proposal.md's Capabilities
               section), format as
               `<type>(<scope>): <change-name>`. Otherwise
               `<type>: <change-name>`.

            b. Prompt the user:

                 No PR exists for <feature-branch>. Open one now?

                 Suggested title: <generated conventional-commit title>

                 1. Yes, create PR with the suggested title (recommended)
                 2. Yes, create PR with a custom title (please provide it)
                 3. No, skip PR creation — I'll open it later or never

            c. If the user picks 1 or 2, create the PR:

                 gh pr create --title "<title>" --body "$(cat <<'EOF'
                 Implements OpenSpec change `<change-name>`.

                 Full artifacts are in `openspec/changes/<change-name>/`. The
                 superspec-generated code-reviewer orientation is posted as a
                 comment on this PR.
                 EOF
                 )"

               Capture the new PR URL and use it for the orientation
               comment in step 12.

            d. If the user picks 3:
               Record `PR comment status: skipped (no PR)` in
               finalize.md. Skip step 12 (which would self-skip
               anyway).

          If PR_NUMBER is empty AND the session is non-interactive:
            Skip silently. Record
            `PR comment status: skipped (no PR)` in finalize.md.
            Skip step 12.

      12. Run the comment-posting subroutine (see "Code-reviewer
          onboarding comment subroutine" below). Update the
          `PR comment status` field in finalize.md with the result
          and amend the receipt commit (or add a follow-up commit
          and push) so finalize.md is accurate. Non-blocking — on
          subroutine failure, record `failed: <reason>` and continue.

      Recommended (non-blocking): before step 8, write a short
      retrospective.md in the change directory. Six suggested
      sections: Wins, Misses, Plan deviations, Skill/workflow
      compliance, Surprises, Promote candidates. Evidence first,
      opinion second. Skippable for trivial single-commit fixes.

      ------------------------------------------------------------
      Code-reviewer onboarding comment subroutine
      ------------------------------------------------------------

      Assumption: the human who pre-reviewed the proposal/specs
      (logic review) may not be the same human who reviews the code.
      This subroutine posts a single PR comment to orient the code
      reviewer. It is invoked from the git-side closeout (step 12)
      AND from the escape hatch (step 3 of the escape-hatch
      instructions below)
      so that any PR present at finalize completion gets a comment.

      Subroutine body:

      a. Detect the PR:
         PR_NUMBER=$(gh pr view "$FEATURE_BRANCH" --json number --jq .number 2>/dev/null)
         If empty: record `PR comment: skipped (no PR)` in
         finalize.md and return.

      b. Build the comment body. The body starts with the literal
         marker `<!-- superspec:finalize-comment -->` on its own
         line, followed by sections per the body template. The
         agent MUST summarize content from proposal.md /
         retrospective.md in its own words (200-400 words target,
         hard ceiling 600 words). Do NOT paste from the source
         artifacts. Capability names are taken verbatim because
         they are identifiers; everything else is paraphrased.

         Body template:

         <!-- superspec:finalize-comment -->
         ## Superspec finalize — code review orientation

         This PR contains the implementation and the full openspec
         change directory at `openspec/changes/<change-name>/`.
         The code is ready for review.

         ### What this change is

         <2-3 sentences SUMMARIZING proposal.md's Why and What
         Changes sections in the agent's own words. Do NOT paste
         from proposal.md.>

         ### Capabilities affected

         <Bulleted list, one bullet per capability. Capability
         NAMES verbatim from proposal.md; per-bullet summary in
         the agent's own words.>

         ### Suggested code-reviewer reading order

         1. `openspec/changes/<change-name>/proposal.md` — motivation
         2. `openspec/changes/<change-name>/specs/<capability>/spec.md` — behavioral requirements (the code must match these scenarios)
         3. `openspec/changes/<change-name>/design.md` *(if present)* — technical approach
         4. PR diff — the actual code
         5. `openspec/changes/<change-name>/verify.md` — validation results (look for warnings)

         ### Implementation summary

         - **Tasks**: <X> of <Y> complete (see `tasks.md`).
         - **Apply iterations**: <N> (see `apply.md`).
         - **Verify outcome**: <PASS / PASS_WITH_WARNINGS>.
         - **Test baseline at finish**: passing.

         ### Notable from the implementer

         <2-4 bullets summarizing retrospective.md's Plan deviations
         + Surprises sections in the agent's own words. If
         retrospective.md is missing: "No retrospective notes
         provided.">

         ---
         *Auto-generated by Superspec finalize. Full receipt at
         `openspec/changes/<change-name>/finalize.md`. Re-running
         finalize will edit this comment in place, not duplicate
         it.*

      c. Idempotency check: list existing PR comments and look for
         one whose body starts with the marker:

         REPO=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
         EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
           --jq '.[] | select(.body | startswith("<!-- superspec:finalize-comment -->")) | .id' | head -1)

      d. If EXISTING is non-empty, edit in place:

         gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
           -f body=@/tmp/superspec-finalize-comment.md
         Record `PR comment: edited-existing` in finalize.md.

         Otherwise, post a new comment:

         gh pr comment "$PR_NUMBER" --body-file /tmp/superspec-finalize-comment.md
         Record `PR comment: posted` in finalize.md.

      e. On any failure (gh missing, draft PR with comments
         disabled, network/auth/rate-limit error), record
         `PR comment: failed — <reason>` in finalize.md. Do NOT
         roll back the merge/push. The change is git-clean; the
         comment is a nice-to-have, not a correctness gate.

      ------------------------------------------------------------
      Borrowed logic and recreation method
      ------------------------------------------------------------

      The worktree-cleanup provenance guard (step 6) and the
      structural pattern of test-verify → merge → test-verify →
      cleanup → delete-branch are adapted from
      superpowers:finishing-a-development-branch Step 5 (Option 1)
      and Step 6 (Cleanup Workspace).

      Upstream URL:
      https://github.com/obra/superpowers/blob/main/skills/finishing-a-development-branch/SKILL.md
      Commit at time of port: f2cbfbefebbfef77321e4c9abc9e949826bea9d7

      To re-port if the upstream skill changes meaningfully: diff
      the steps above against the upstream skill's current Step 5
      (Option 1) and Step 6, port any meaningful behavioral
      changes back into this instruction, then update the commit
      hash above. A short subsection in docs/workflow-details.md
      ("Borrowed logic and recreation method") restates this
      discipline.

      ------------------------------------------------------------
      Escape hatch: manual skill invocation
      ------------------------------------------------------------

      If your workflow does not match the git-side closeout — solo /
      local-only (skill Option 1 merge-locally to main); brand-new PR
      via the skill (Option 2); keep the worktree alive for iteration
      (Option 3); or discard the work (Option 4) — invoke
      `superpowers:finishing-a-development-branch` directly via
      the Skill tool and pick the matching option.

      After the skill returns:
      1. Hand-write finalize.md from
         openspec/schemas/superspec/templates/finalize.md, picking
         the matching Outcome value (`merge-locally`, `pr-created`,
         `kept-as-is`, or `discarded`).
      2. Commit finalize.md to whichever branch is appropriate for
         the outcome.
      3. Run the comment-posting subroutine above regardless of
         which option ran. It self-skips when no PR exists
         (Options 1, 3, 4) and posts/edits when a PR exists
         (Option 2 or an earlier git-side closeout left one).

      This step 3 is the explicit guarantee that the code-reviewer
      comment exists on any PR that exists at finalize completion,
      even outside the canonical automation.

      Once finalize.md exists, the change is git-clean and ready
      for /openspec-archive-change. See docs/workflow-details.md Phase 6
      (Archival) for the golden path.
    requires:
      - verify

apply:
  requires: [plan, review]
  tracks: tasks.md
  instruction: |
    SANDBOX-AS-PRODUCTION (onePress, UI changes only):
    If `ui-spec.md` exists in this change, apply runs in two stages.
    Stage 1: write the production view component directly from the
    tokens in ui-spec.md sections 2 and 5 — 100% props-driven (data,
    status, isSubmitting, callbacks all passed via props). Do NOT
    translate sandbox-preview.html into components; the sandbox is a
    visual reference only. Do NOT inject a floating in-app State Bar.
    Stage 2: wire real data through hooks/containers. The UI structure
    and class lists MUST NOT change.
    Changes with `**UI Change**: no` skip both stages.

    REVIEW LOCK (onePress): this phase requires both `review.md` and, for
    UI changes, `ui-spec.md` line 3 `> Review-Status: APPROVED`.
    - Read `review.md`; if it is missing, or `Result` is not `PASS`/`SKIP`,
      STOP and produce the `review` artifact first.
    - If `ui-spec.md` exists, its `Review-Status` must be `APPROVED`.
      Agent MUST NOT self-approve.
    - Run `bash scripts/onepress-review-lint.sh --change <change-dir>`;
      a non-zero exit means the review is missing, stale (hashes changed),
      or not approved. STOP and re-run the review artifact.

    V2.2 EXECUTION IRON LAWS (all changes):
    1. TDD iron law: for every logic task, the first output MUST be the
       failing test plus its test-run command. Do NOT output production
       code before a recorded RED failure. If you claim GREEN without a
       RED run in this session, delete the ghost code and return to RED.
       A docs/config-only task MUST record `TDD: N/A (<reason>)` in
       apply.md instead of silently skipping.
    2. Root-cause iron law: on an unexpected test failure or compile
       error, or after two failed fix attempts, STOP patching. Run the
       four-step trace: read the full stack/error and find the earliest
       trigger; trace the invalid data backward to its source; write one
       text hypothesis ("I think X is the root cause because Y"); run the
       smallest experiment. If the hypothesis is disproved, revert to the
       original error state before forming a new one. Record the trace in
       `review-ledger.md` under `Action: root-cause`; `apply.md` keeps
       only the current iteration plus a pointer. If the same
       `Fingerprint` appears a second time, mark that ledger row
       `Action: rewrite` with `FORCE-REWRITE`, rewrite the module and add
       its `## Boundary Matrix` instead of a third local patch.
    3. Fresh evidence: after every task, paste the real command output
       and exit code into apply.md. Never use "should pass", "looks
       correct", "probably" or equivalent speculation.
    4. Review lock: the UI design review and the code blind review are
       separate. `/openspec-review-change` owns the former; verify-report owns the
       latter.

    Before implementing, set up an isolated workspace and executor:

    0. **Pre-flight — commit change artifacts to feature branch**:

       Superspec's canonical starting state is a user-created feature
       branch (e.g., `spec/<change-name>`, `feat/<change-name>`). The
       artifact phases (brainstorm through plan) should have committed
       their files to this branch. Step 0 ensures the change directory
       is committed before the worktree is created.

       Steps:
       a. Run `git status --porcelain openspec/changes/<name>/` to
          inspect state.
       b. If the output contains untracked entries (lines starting
          with `??`), stage and commit ONLY this change's directory
          (do NOT use `git add -A`):

          ```
          git add openspec/changes/<name>/
          git commit -m "docs(openspec): scaffold <name> change

          Captures pre-implementation artifacts (brainstorm/proposal/
          specs/tasks/plan) so the implementation worktree starts
          with the change directory already tracked."
          ```

       c. If the output is empty (everything committed) or contains
          only modifications (`M`) without untracked entries, skip
          the commit — the change directory is already tracked.

       d. **Branch-state checks** (v4):
          - **Recommended**: a feature branch (any branch that is not
            the project's integration branch — typically `main` or
            `master`). This is the canonical starting state for the
            git-side closeout. Finalize's git-side closeout will merge
            the worktree back into this branch and push to update the
            existing PR.
          - **Tolerated with warning**: on the integration branch.
            Proceed, but warn the user that (1) artifact commits will
            land on the integration branch and (2) finalize's git-side
            closeout will not produce a usable PR because there is no
            separate feature branch to merge into; the user will need
            to fall back to the manual escape hatch in finalize.
          - **Detached HEAD**: warn the user that finalize's git-side
            closeout will be skipped (no branch to merge into), and
            the user will need to use the escape hatch. Proceed with
            apply on the detached HEAD; the worktree will still be
            created.

    1. **Workspace** — worktree is optional:
       - Canonical: if `superpowers:using-git-worktrees` is available,
         use the Skill tool to invoke it and create an isolated worktree
         for this change.
       - FALLBACK (skill unavailable, or the user prefers a single
         workspace): use plain git —
         `git worktree add .worktrees/<change-name> -b <change-name>`
         — or skip the worktree and implement on the current branch.
       - Either way, record the mode in apply.md as
         `workspace: worktree | single-workspace` and the branch used.

    2. **Executor** — pick the FIRST available option, in order:
       **2a** subagent-driven-development → **2b** executing-plans →
       **2c** inline task-by-task (always available, no skills needed).
       Never stop just because 2a or 2b is unavailable.

       **2a. Preferred — subagent-driven-development** (only when
       `superpowers:subagent-driven-development` is in your skill list):

       Use the Skill tool to invoke
       **superpowers:subagent-driven-development** to execute
       the plan.md micro-tasks with fresh subagents per task.

       Tell the executor:
       - Read plan.md in this change directory for micro-tasks
       - Update tasks.md checkboxes as coarse tasks complete
       - Work within the created worktree

       IMPORTANT — transitive skill activation:
       subagent-driven-development internally enforces the
       following skills, so you do NOT need to invoke them
       manually:
       - **superpowers:test-driven-development** — every task
         follows RED-GREEN-REFACTOR. Implementation code written
         before a failing test is deleted.
       - **superpowers:requesting-code-review** — after each
         task, a code-reviewer subagent is dispatched to catch
         spec compliance and code quality issues. A final review
         runs for the entire implementation before apply
         concludes.

       **2b. Fallback — executing-plans** (only when that skill is in
       your skill list; otherwise go straight to 2c):

       The superpowers:executing-plans SKILL.md itself states:
       "If subagents are available, use superpowers:subagent-
       driven-development instead of this skill." executing-plans
       exists for platforms or sessions without Task-tool /
       subagent support. On Claude Code, subagents ARE available,
       so this path should not be used under normal circumstances.

       If you must use 2b (e.g. running in a constrained runtime
       without subagent support), use the Skill tool to invoke
       **superpowers:executing-plans** and note that 2b does NOT
       transitively activate TDD or code-review. You are
       responsible for:
       - Following TDD discipline manually (the executor will
         not enforce it)
       - Invoking **superpowers:requesting-code-review** yourself
         after completing the plan, before proceeding to step 3

       **2c. SKILL FALLBACK — inline executor (always available, no
       Superpowers skills required)**:

       Use this when neither 2a nor 2b is available. For each task in
       tasks.md, in dependency order:
       1. If the task changes logic, write the failing test first (RED)
          and run it; record the failing assertion and exit code in
          apply.md. Pure logic only — do not write DOM snapshot tests.
       2. Implement the minimum code until the test passes (GREEN),
          then refactor while keeping it green. Paste the passing run
          into apply.md.
       3. On any unexpected failure, follow the root-cause iron law
          before writing another patch; record the hypothesis and the
          experiment outcome under `Root-Cause Log`.
       4. Run the project's test / build / lint command and paste the
          result into apply.md. No speculative wording.
       5. Tick that task's checkbox in tasks.md. For docs/config-only
          tasks, record `TDD: N/A (<reason>)`.
       6. After all tasks: diff the implementation against the specs
          (`git diff <base>...HEAD`), list any spec drift or skipped
          state in apply.md — this inline self-review replaces
          superpowers:requesting-code-review.

       State explicitly in apply.md that mode 2c was used and why.

    3. **Receipt**: Write `apply.md` per `templates/apply.md`. Read
       `review_round` from `review-ledger.md` and use it as
       `Iteration:`; when the ledger is absent, set iteration to `1` and
       record `Ledger: absent (legacy)` in the receipt. Overwrite the
       file with current state: worktree path, branch, commit range,
       tasks completed X of Y,
       remaining tasks, executor identity, and an ISO timestamp.
       The receipt is the artifact that satisfies the DAG so
       `verify` becomes reachable.

    4. **Verification**: Once the receipt exists, produce the
       `verify` artifact by invoking **openspec-verify-change**
       to check completeness, correctness, and coherence. The DAG
       blocks `verify` until apply.md exists.

       Convergence loop — react to the verify outcome:
       - PASS or PASS_WITH_WARNINGS → proceed via /openspec-continue-change to the
         finalize artifact, which executes the git-side closeout
         directly (merge worktree → feature branch, push the branch,
         update the PR if one exists, post code-reviewer comment if a
         PR is present) and writes finalize.md. The skill
         superpowers:finishing-a-development-branch is retained as a
         manual escape hatch for non-canonical flows. /openspec-archive-change
         runs once finalize.md exists.
       - FAIL with code-fixable items → return to step 2 (Executor),
         re-run with the same iteration mechanics (apply.md is
         overwritten, iteration counter increments), then re-run verify.
       - FAIL with artifact-level items (e.g. spec drift) → fix the
         offending artifact (specs / design / tasks / plan), then
         re-enter step 2 with iteration N+1.
       - Repair rounds > 3 (counted in `review-ledger.md`) → record
         `ESCALATE` and report to the user instead of continuing
         automatically.

    If any skill is unavailable, fall back in this order: 2a → 2b → 2c.
    Never halt the apply phase because a Superpowers skill is missing;
    2c (inline task-by-task) is always available and produces the same
    artifacts.
